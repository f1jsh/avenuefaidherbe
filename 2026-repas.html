<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f5f5f5;
}

header {
    background: #2c3e50;
    color: white;
    text-align: center;
    padding: 30px;
}

nav {
    background: #34495e;
    text-align: center;
    padding: 12px;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 15px;
    font-weight: bold;
}

.info {
    text-align: center;
    margin: 20px;
    color: #555;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 12px;
    padding: 20px;
}

.grid img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
    cursor: pointer;
}

.lightbox {
    display: none;
    position: fixed;
    z-index: 10;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,.92);
    align-items: center;
    justify-content: center;
}

.lightbox img {
    max-width: 92%;
    max-height: 88%;
    border-radius: 8px;
}

.close {
    position: fixed;
    top: 20px;
    right: 30px;
    color: white;
    font-size: 42px;
    cursor: pointer;
    z-index: 20;
}

.prev, .next {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    font-size: 42px;
    background: rgba(255,255,255,.25);
    color: white;
    border: none;
    padding: 14px 18px;
    cursor: pointer;
    border-radius: 8px;
    z-index: 20;
}

.prev { left: 20px; }
.next { right: 20px; }

.back {
    display: inline-block;
    margin: 20px;
    padding: 10px 14px;
    background: #2c3e50;
    color: white;
    text-decoration: none;
    border-radius: 6px;
}

footer {
    text-align: center;
    padding: 20px;
    color: #666;
}

@media (max-width: 600px) {
    .grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    }

    .grid img {
        height: 120px;
    }

    .prev, .next {
        font-size: 30px;
        padding: 10px 12px;
    }
}
</style>
</head>

<img id="bigimg">
<button class="next" onclick="nextImg()">&#10095;</button>

<script>
let photos = [];
let current = 0;

document.addEventListener("DOMContentLoaded", function(){
    photos = Array.from(document.querySelectorAll(".grid img")).map(img => img.src);
});

function openImg(src){
    current = photos.indexOf(src);
    document.getElementById("bigimg").src = src;
    document.getElementById("lightbox").style.display = "flex";
}

function closeImg(){
    document.getElementById("lightbox").style.display = "none";
}

function prevImg(){
    current = (current - 1 + photos.length) % photos.length;
    document.getElementById("bigimg").src = photos[current];
}

function nextImg(){
    current = (current + 1) % photos.length;
    document.getElementById("bigimg").src = photos[current];
}

document.addEventListener("keydown", function(e){
    if(document.getElementById("lightbox").style.display !== "flex") return;
    if(e.key === "Escape") closeImg();
    if(e.key === "ArrowLeft") prevImg();
    if(e.key === "ArrowRight") nextImg();
});
</script>
